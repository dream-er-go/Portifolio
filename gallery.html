<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Gallery</title>

<style>
body{
  margin:0;
  padding:20px;
  background:#121212;
}

.gallery-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:20px;
}

.gallery-grid img{
  width:100%;
  height:180px;
  object-fit:cover;
  border-radius:12px;
  transition:0.3s;
}

.gallery-grid img:hover{
  transform:scale(1.05);
}
</style>
</head>

<body>

<div class="gallery-grid">
  <img src="https://i.pinimg.com/736x/13/ee/0f/13ee0f858b13174803a9f928cc22c64c.jpg">
  <img src="https://i.pinimg.com/736x/7e/d8/c1/7ed8c1ab11e99b740459c63eaee65eed.jpg">
  <img src="https://i.pinimg.com/736x/99/63/39/9963395ed6dbc066c932893c14a16ece.jpg">
  <img src="https://i.pinimg.com/1200x/1c/7f/b8/1c7fb847393648930ad72d153aed8533.jpg">
  <img src="https://i.pinimg.com/736x/00/fc/02/00fc02a39fa23d3200f22433a07ca28e.jpg">
  <img src="https://i.pinimg.com/736x/cf/49/3a/cf493a1ba93385761adac90c43e866a3.jpg">
  <img src="https://i.pinimg.com/1200x/59/b6/de/59b6de2a05dfaacca417d5f77e007471.jpg">
  <img src="https://i.pinimg.com/736x/94/5d/19/945d19cce301ac745797391b46b5c81a.jpg">
  <img src="https://i.pinimg.com/736x/89/91/e8/8991e8a32da59f1d0548224c473f524e.jpg">
  <img src="https://i.pinimg.com/736x/08/06/00/080600a5acfeb4695914e1e6d30a8f94.jpg">
</div>

</body>
</html>
